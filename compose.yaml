# Local n8n for LendLoop. Secrets never go in this file or in n8n's environment:
# - the shared signing key lives in the n8n credential "LendLoop automation JWT";
# - n8n's own encryption key is mounted as a file (N8N_ENCRYPTION_KEY_FILE).
# Workflow expressions may read the environment (for CONVEX_SITE_URL), so only
# non-secret settings belong in `environment`.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.5
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - N8N_ENCRYPTION_KEY_FILE=/run/secrets/n8n_encryption_key
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Mock notifications are console.log lines; this sends them to `docker compose logs`.
      - CODE_ENABLE_STDOUT=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:?set the Convex HTTP actions URL (ends in .convex.site)}
    secrets:
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
secrets:
  n8n_encryption_key:
    file: ./.secrets/n8n_encryption_key
volumes:
  n8n_data:
